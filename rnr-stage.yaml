# CI configuration. Edit this file, then commit and push.
#
# 1. Set `stage` (fetch -> decode -> execute -> writeback -> integration).
#    CI checks that stage and every earlier one; modules of later stages are ignored.
# 2. Point `source_files` at your .sv file for each module you have written. The paths below are
#    only suggestions: use any file names or folders (no spaces in paths).
# 3. Only if your module/port/parameter names differ from the spec, add under that module:
#      top_module: my_name
#      ports:  {spec_port: your_port}
#      params: {DATA_WIDTH: your_param}
#    See the assignment handout for an example.
# 4. A module that instantiates other modules (id_stage, ex_stage, single_cycle_riscv) needs those
#    modules listed here too.
yaml_version: 1

stage: decode

modules:
  if_stage:
    source_files: [if_stage.sv]
    ports: {pc_signed_offset: PC_so, pc_new: PC_new}
  decoder:
    source_files: [decoder.sv]
  main_control:
    source_files: [maincontrol.sv]
    top_module: maincontrol
    ports: {reg_write: regwrite}
  register_file:
    source_files: [register_file.sv]
  imm_generator:
    source_files: [imm_generator.sv]
  id_stage:
    source_files: [id_stage_top.sv]
    top_module: id_stage_top
    ports: {imm_out: imm_output, opcode_out_d: opcode, fn3_out_d: fn3,
            mem_write: memwrite, mem_read: memread, alu_src: alusrc}
